name: Deploy graphty.app

# graphty.app serves site/ of this repository's main branch. graphty-monorepo's promote-pages.yml commits to it:
# a promotion (a whole build that graphty-monorepo already deployed to beta.graphty.app), or a release's hosted
# datasets. Every such push deploys main as it is then. To redeploy, run this workflow by hand.
on:
    push:
        branches: [main]
        paths: ["site/**"]
    workflow_dispatch:

# One deploy at a time; a newer pending deploy replaces an older pending one (it deploys main's newer tip).
concurrency:
    group: pages

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    deploy:
        name: Deploy
        runs-on: ubuntu-24.04
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4

            - name: Check there is a site
              run: grep -o 'name="graphty-build" content="[^"]*"' site/index.html

            - uses: actions/configure-pages@v4

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: ./site

            - id: deployment
              uses: actions/deploy-pages@v4
