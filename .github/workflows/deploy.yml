name: Deploy beta.graphty.app

# Publishes one beta build (a release of this repository) as the beta.graphty.app site.
#
# graphty-monorepo's deploy-pages.yml makes a release here for every green master build of
# graphty-org/graphty-monorepo, tagged build-<commit>, holding the assembled site as two assets
# (site.tar.gz, and data.tar.gz with /data/graph-samples/v1/), and then sends a "deploy" repository
# dispatch naming the tag. To put an earlier build back on beta, run this workflow by hand with its tag.
on:
    repository_dispatch:
        types: [deploy]
    workflow_dispatch:
        inputs:
            tag:
                description: "The build's release tag (build-<commit>)"
                required: true

# One deploy at a time; a newer pending deploy replaces an older pending one.
concurrency:
    group: pages

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        name: Unpack the build
        runs-on: ubuntu-24.04
        env:
            TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        steps:
            - name: Download and unpack the release assets
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  case "$TAG" in build-[0-9a-f]*) ;; *) echo "::error::not a build tag: '$TAG'"; exit 1 ;; esac
                  gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.tar.gz' -D "$RUNNER_TEMP/assets"
                  mkdir -p public
                  for asset in "$RUNNER_TEMP"/assets/*.tar.gz; do tar -xzf "$asset" -C public; done
                  grep -o 'name="graphty-build" content="[^"]*"' public/index.html

            - uses: actions/configure-pages@v4

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: ./public

    deploy:
        name: Deploy
        needs: build
        runs-on: ubuntu-24.04
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
